<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>되살아난 기사</title>
<style>
:root{--bg:#0d0e15;--ink:#e8e4d8;--dim:#8d8a9b;--gold:#f2c14e;--red:#e04848;--pan:#161824ee;--line:#2c2f40}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;overflow:hidden;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px;z-index:5;text-align:center}
.ov.on{display:flex}
.btn{font:inherit;font-size:15px;color:var(--ink);background:#1d2030;border:1px solid var(--line);border-radius:8px;padding:10px 18px;min-width:96px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.main{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.35}
.sbtn{font:inherit;font-size:13px;color:var(--dim);background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.logo{font-size:30px;font-weight:700;letter-spacing:4px}
.sub{color:var(--dim);font-size:14px;line-height:1.6}
.keys{color:var(--dim);font-size:12px;margin-top:6px}
#title{background:radial-gradient(circle at 50% 40%,#1a1c2a,#07080c)}
#hub{justify-content:flex-end;background:linear-gradient(transparent 35%,#07080cdd 70%);padding-bottom:max(16px,env(safe-area-inset-bottom))}
.hubTop{position:fixed;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.dlg{width:min(560px,94vw);background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-align:left}
.who{font-size:12px;color:var(--gold);margin-bottom:4px}
.line{font-size:15px;line-height:1.6}
.hint{font-size:12px;color:var(--dim);margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.curse{display:none;align-items:center;gap:10px;font-size:13px;color:var(--red)}
.panel{width:min(520px,94vw);max-height:88vh;overflow:auto;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left}
.ph{font-size:16px;font-weight:700;display:flex;justify-content:space-between}
.ph span{color:var(--gold);font-weight:400;font-size:14px}
.up{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.up .tx{flex:1}.up .nm{font-size:14px}.up .ds{font-size:12px;color:var(--dim)}
.up .btn{min-width:84px;padding:7px 10px;font-size:13px}
.lg{font-size:14px;line-height:1.6;border-top:1px solid var(--line);padding-top:8px}
.lg b{color:var(--gold);font-weight:400;font-size:12px;display:block}
.lg.no{color:var(--dim)}
#pick{background:#07080cc8}
.ptitle{font-size:15px;color:var(--dim)}
#cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{width:min(170px,29vw);min-height:130px;background:#171a27;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:active{transform:scale(.98)}
.card .tg{font-size:11px;display:flex;align-items:center;gap:5px}
.card .tg i{width:8px;height:8px;display:inline-block}
.card .nm{font-size:15px;font-weight:700}
.card .ds{font-size:12px;color:var(--dim);line-height:1.5}
.card .st{font-size:11px;margin-top:auto}
.card.set{border-color:var(--gold);box-shadow:0 0 12px #f2c14e40}
.big{font-size:26px;font-weight:700;letter-spacing:3px}
#dead{background:#000a}
#ending{background:#000;gap:18px}
#endText p{font-size:15px;line-height:1.9;color:var(--ink);opacity:0;transition:opacity 1.2s;max-width:520px}
#endText p.on{opacity:1}
#pop{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-size:26px;font-weight:800;color:var(--gold);letter-spacing:4px;pointer-events:none;opacity:0;z-index:4;text-shadow:0 0 12px #f2c14e88}
#pop.go{animation:pop .7s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
#toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);font-size:14px;background:var(--pan);border:1px solid var(--line);border-radius:8px;padding:8px 14px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:4;white-space:nowrap}
#toast.on{opacity:1}
#bossname{position:fixed;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink);pointer-events:none;z-index:3;display:none;letter-spacing:2px}
#bPause{position:fixed;top:8px;right:10px;z-index:6;display:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#161824aa;color:var(--dim);font-size:12px}
#touch{position:fixed;inset:0;pointer-events:none;z-index:3;display:none}
#touch .tb{position:absolute;pointer-events:auto;border-radius:50%;border:1px solid #ffffff30;background:#ffffff0d;color:#ffffffb0;font-size:12px;display:flex;align-items:center;justify-content:center;touch-action:none}
#touch .tb.on{background:#ffffff2a}
#rot{background:#07080cf2}
</style></head><body>
<div id="wrap"><canvas id="cv" width="320" height="180"></canvas></div>
<div id="bossname"></div><div id="pop"></div><div id="toast"></div>
<button id="bPause">II</button>
<div id="touch">
 <div class="tb" data-k="l" style="left:14px;bottom:22px;width:62px;height:62px">◀</div>
 <div class="tb" data-k="r" style="left:86px;bottom:22px;width:62px;height:62px">▶</div>
 <div class="tb" data-k="a" style="right:78px;bottom:18px;width:68px;height:68px">공격</div>
 <div class="tb" data-k="b" style="right:156px;bottom:26px;width:56px;height:56px">막기</div>
 <div class="tb" data-k="j" style="right:12px;bottom:70px;width:56px;height:56px">점프</div>
 <div class="tb" data-k="c" style="right:86px;bottom:98px;width:50px;height:50px">구르기</div>
</div>
<div id="title" class="ov on">
 <div class="logo">되살아난 기사</div>
 <div class="sub">죽을 때마다 성의 이야기가 하나씩 밝혀집니다.</div>
 <button class="btn main" id="bStart">시작</button>
 <div class="keys">이동 ← → · 점프 ↑ · 내려가기 ↓ · 공격 Z · 막기 X · 구르기 C</div>
 <div class="keys">흰 공격은 막고, 빨간 공격은 피하세요.</div>
</div>
<div id="hub" class="ov">
 <div class="hubTop"><span id="hubDeaths"></span><span id="hubEmb"></span></div>
 <div class="dlg"><div class="who" id="dWho"></div><div class="line" id="dLine"></div><div class="hint" id="dHint"></div></div>
 <div class="curse" id="curseRow"><button class="sbtn" id="cMinus">−</button><span id="curseTxt"></span><button class="sbtn" id="cPlus">+</button></div>
 <div class="row"><button class="btn" id="bForge">대장간</button><button class="btn" id="bLog">기록</button><button class="btn main" id="bGo">출발</button></div>
</div>
<div id="forge" class="ov"><div class="panel"><div class="ph">대장간 <span id="fEmb"></span></div><div id="fList"></div><button class="btn" id="fBack">돌아가기</button></div></div>
<div id="log" class="ov"><div class="panel"><div class="ph">기록</div><div id="lList"></div><button class="btn" id="lBack">돌아가기</button></div></div>
<div id="pick" class="ov"><div class="ptitle" id="pTitle">하나를 고르세요</div><div id="cards"></div><button class="sbtn" id="bReroll"></button></div>
<div id="dead" class="ov"><div class="big">쓰러졌다</div><div class="sub" id="deadSub"></div></div>
<div id="pause" class="ov" style="background:#07080cd8"><div class="big">일시정지</div><button class="btn main" id="bResume">계속</button><button class="btn" id="bQuit">포기하고 성으로</button></div>
<div id="ending" class="ov"><div id="endText"></div><button class="btn main" id="bEnd" style="opacity:0">계속</button></div>
<div id="rot" class="ov"><div class="sub">화면을 가로로 돌리면 더 편합니다.</div><button class="btn" id="bRot">그대로 하기</button></div>
<script>
'use strict';
const W=320,H=180,GY=152;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)];
// ---------- audio ----------
let AC=null,MG=null,NB=null;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination)}catch(e){AC=null}}
function tone(f,d,type,v,slide,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02)}
function noise(d,v,fq,delay,q){if(!AC)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='bandpass';f.frequency.value=fq||1000;f.Q.value=q||1;g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+d+.02)}
const SFX={
 swing(){noise(.07,.1,2600,0,.8)},
 hit(c){noise(.07,.22,900);tone(c?90:150,.09,'square',c?.18:.1,.5)},
 hurt(){tone(220,.2,'sawtooth',.14,.4);noise(.12,.2,500)},
 guard(){tone(620,.06,'square',.08,.8);noise(.05,.14,3200)},
 parry(n){const b=880+Math.min(n,6)*90;[1,2.01,2.76,4.1].forEach((m,i)=>tone(b*m,.5+.08*n,'sine',.12/(i+1)));tone(70,.25,'sine',.35,.5);noise(.05,.3,5000)},
 roll(){noise(.1,.07,600)},
 jump(){tone(300,.07,'square',.05,1.6)},
 kill(){tone(180,.14,'square',.08,.3)},
 pick(){[523,659,784].forEach((f,i)=>tone(f,.15,'triangle',.11,1,i*.06))},
 set(){[392,494,587,784].forEach((f,i)=>tone(f,.5,'triangle',.13,1,i*.07));tone(98,.6,'sine',.3)},
 tele(r){tone(r?150:1250,.08,r?'sawtooth':'sine',.06)},
 boom(){noise(.35,.3,200,0,.6);tone(60,.4,'sine',.35,.5)},
 die(){tone(200,1.2,'sawtooth',.14,.2)},
 door(){tone(330,.25,'triangle',.1,1.5)},
 zap(){noise(.12,.18,4000,0,2);tone(1500,.1,'square',.05,.3)}
};
// ---------- sprites ----------
const PAL={k:'#14151f',s:'#aab5c7',d:'#5f6b81',v:'#222536',c:'#b8434f',g:'#d6a440',b:'#d9d1bd',r:'#d04545',p:'#5d4a7e',w:'#e8e4d8',m:'#4a4e66',h:'#8a6648',y:'#e6c45a',n:'#3f5d4c',o:'#2a2c3f',f:'#d4a982',q:'#a8b8d0',z:'#33364a'};
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function makeSpr(rows){const h=rows.length,w=Math.max(...rows.map(r=>r.length));const n=mkCanvas(w,h),x=n.getContext('2d');
 for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){const ch=rows[j][i];if(ch!=='.'&&PAL[ch]){x.fillStyle=PAL[ch];x.fillRect(i,j,1,1)}}
 const tint=(col,a)=>{const c=mkCanvas(w,h),t=c.getContext('2d');t.drawImage(n,0,0);t.globalCompositeOperation='source-atop';t.globalAlpha=a;t.fillStyle=col;t.fillRect(0,0,w,h);return c};
 return{n,w:tint('#ffffff',1),r:tint('#ff3030',.55),g:tint('#f2c14e',.8),W:w,H:h}}
const K_TOP=["...kkkk....","..kssssk...","..kssvvk...","..kssssk...",".ckkkkkk...","cckdsssdk..","cckdsssdk..","cckdsssdk..",".ckdgggdk..","..kdsssdk.."];
const RAW={
 kI:K_TOP.concat(["..kdd.ddk..","..kd...dk..","..kk...kk.."]),
 kR1:K_TOP.concat(["..kdd.dk...","..kd..kdk..",".kk....kk.."]),
 kR2:K_TOP.concat(["...kddk....","...kdk.....","...kkk....."]),
 kRoll:["..kkkkk..",".kssssck.","kssvvscck","kdssssdck","kdgggsdck","kdssssdk.",".kdddddk.","..kkkkk.."],
 skel:["...kkk...","..kbbbk..","..krbrk..","..kbbbk..","...kbk...","..kbbbk..",".kbkbkbk.","..kbbbk..","...kbk...","..kbkbk..","..kb.bk..","..kb.bk..","..kk.kk.."],
 spear:["..kkkkk..","..kmmmk..","..krbrk..","..kbbbk..","...kbk...","..kmmmk..",".kbmmmbk.","..kmmmk..","...kbk...","..kbkbk..","..kb.bk..","..kb.bk..","..kk.kk.."],
 archer:["...kkk...","..knnnk..",".knrbrnk.",".knbbbnk.","..knbnk..","..knnnk..",".kbnnnbk.","..knnnk..","...kbk...","..kbkbk..","..kb.bk..","..kb.bk..","..kk.kk.."],
 wraith:["....kkkk....","...kqqqqk...","..kqqkqkqk..","..kqqqqqqk..",".kqqqqqqqqk.",".kqqqqqqqqk.","kqqqqqqqqqqk","kqqkqqqqkqqk","kqk.kqqk.kqk","kk...kk...kk"],
 brute:["....kkkkkk....","...kmmmmmmk...","...kmmmrrmk...","...kmmmmmmk...","..kkkkkkkkkk..",".kmmdmmmmdmmk.","kmmmdmmmmdmmmk","kmmmdmmmmdmmmk","kmmkdmmmmdkmmk","kmmkdggggdkmmk","kkk.dmmmmd.kkk","....dmmmmd....","...kdd..ddk...","...kd....dk...","...kd....dk...","...kk....kk..."],
 grave:["....kkkkkk....","...kppppppk...","..kppkbbkppk..","..kpkbrbrkpk..","..kpkbbbbkpk..","..kppkbbkppk..",".kppppppppppk.","kpppkppppkpppk","kppk.kppk.kppk","kpk..kppk..kpk",".k...kppk...k.",".....kppk.....","......kk......"],
 king:["..y.y.y....","..kyyyyk...","..kooork...","..koooook..",".pkkkkkk...","ppkzooozk..","ppkzooozk..","ppkzooozk..",".pkzyyyzk..","..kzooozk..","..kzz.zzk..","..kz...zk..","..kk...kk.."],
 priest:["...kkk...","..kwwwk..","..kwffk..","..kwffk..","..kwwwk..",".kwwwwwk.",".kwwgwwk.",".kwwgwwk.",".kwwwwwk.",".kwwwwwk.","kwwwwwwwk","kkkkkkkkk"],
 smith:["...kkk...","..khhhk..","..kfffk..","..kfffk..","...kfk...",".kfhhhfk.","kffhhhffk","kf.hhh.fk","...hhh...","..kzzzk..","..kz.zk..","..kz.zk..","..kk.kk.."],
 boy:["..kkk..",".khhhk.",".kfffk.",".kfffk.","..kck..",".kcccck","kfcccfk","..kzk..","..kzk..","..k.k.."]
};
const SPR={};
function buildSprites(){for(const k in RAW)SPR[k]=makeSpr(RAW[k]);SPR.gate=makeSpr(RAW.brute.map(r=>r.replace(/m/g,'d').replace(/r/g,'y')))}
// pixel digits 3x5
const FONT={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111','-':'000000111000000','+':'000010111010000','/':'001001010100100','x':'000101010101000'};
function drawNum(s,x,y,c,sc){s=String(s);sc=sc||1;ctx.fillStyle=c||'#e8e4d8';for(let n=0;n<s.length;n++){const g=FONT[s[n]];if(g)for(let i=0;i<15;i++)if(g[i]==='1')ctx.fillRect(x+n*4*sc+(i%3)*sc,y+Math.floor(i/3)*sc,sc,sc)}}
// ---------- save ----------
const SK='revived_knight_v0';
let sv={deaths:0,frag:0,emb:0,up:{hp:0,atk:0,foc:0,rec:0,rer:0,gear:0},best:0,ended:false,curse:0,maxCurse:0,clears:0,seen:0};
function loadSave(){try{const d=JSON.parse(localStorage.getItem(SK)||'null');if(d){const up=Object.assign({},sv.up,d.up||{});sv=Object.assign(sv,d);sv.up=up}}catch(e){}}
function saveGame(){try{localStorage.setItem(SK,JSON.stringify(sv))}catch(e){}}
// ---------- data ----------
const TAGS={fire:{n:'불꽃',c:'#e8803a'},ctr:{n:'반격',c:'#f2c14e'},bld:{n:'피',c:'#d04545'},ltn:{n:'번개',c:'#6fb4e8'},stl:{n:'강철',c:'#aab5c7'}};
const SETS={fire:'모든 공격이 불을 붙이고, 불붙은 적은 죽을 때 폭발합니다.',ctr:'완벽 막기 때 주변 적에게 충격파가 퍼집니다.',bld:'처치할 때 체력을 회복하고, 체력이 낮을수록 강해집니다.',ltn:'공격 3번마다 번개가 적 4마리에게 튑니다.',stl:'막기로 모든 피해를 막고, 완벽 막기가 쉬워집니다.'};
const ITEMS=[
 {id:'ember',tag:'fire',n:'불씨 검',d:'공격 시 30% 확률로 불을 붙입니다.',u:0,f:s=>{s.burnCh+=.3}},
 {id:'oil',tag:'fire',n:'용의 기름',d:'불 피해 2배, 불 붙일 확률 +10%.',u:0,f:s=>{s.burnDps*=2;s.burnCh+=.1}},
 {id:'ashb',tag:'fire',n:'재의 장화',d:'구르면 지나간 자리에 불길이 남습니다.',u:0,f:s=>{s.rollFire+=1}},
 {id:'fheart',tag:'fire',n:'불꽃 심장',d:'불붙은 적에게 주는 피해 +50%.',u:4,f:s=>{s.burnBonus+=.5}},
 {id:'mirror',tag:'ctr',n:'거울 방패',d:'완벽 막기 후 반격 피해 3배 → 5배.',u:0,f:s=>{s.critMul+=2}},
 {id:'crest',tag:'ctr',n:'되받기 문장',d:'완벽 막기 때 체력 5 회복.',u:0,f:s=>{s.parryHeal+=5}},
 {id:'blades',tag:'ctr',n:'칼날 반사',d:'완벽 막기 때 칼날 2개가 날아갑니다.',u:2,f:s=>{s.blades+=2}},
 {id:'slow',tag:'ctr',n:'느린 모래시계',d:'슬로모션이 길어지고, 적이 0.6초 더 휘청입니다.',u:5,f:s=>{s.slowB+=.2;s.stagger+=.6}},
 {id:'oath',tag:'bld',n:'피의 서약',d:'공격력 +35%, 최대 체력 -15.',u:0,f:s=>{s.atk*=1.35;s.maxhp-=15}},
 {id:'fang',tag:'bld',n:'흡혈 송곳니',d:'준 피해의 6%만큼 회복합니다.',u:0,f:s=>{s.life+=.06}},
 {id:'bers',tag:'bld',n:'광전사의 끈',d:'체력이 낮을수록 공격력 최대 +80%.',u:3,f:s=>{s.lowHp+=.8}},
 {id:'cup',tag:'bld',n:'붉은 잔',d:'적을 처치하면 체력 3 회복.',u:6,f:s=>{s.killHeal+=3}},
 {id:'ring',tag:'ltn',n:'번개 반지',d:'공격 속도 +20%.',u:0,f:s=>{s.spd*=1.2}},
 {id:'boots',tag:'ltn',n:'폭풍 장화',d:'이동 속도 +20%, 구르기 대기 -30%.',u:0,f:s=>{s.mv*=1.2;s.rollCd*=.7}},

function fit(){let s=Math.min(innerWidth/W,innerHeight/H);if(s>=2)s=Math.floor(s*2)/2;cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';
 const r=cv.getBoundingClientRect(),bn=$('bossname');bn.style.top=Math.max(2,r.top+s*14-16)+'px';if(G&&G.boss)bn.textContent=ZONES[G.zone].bn}
addEventListener('resize',fit);

 if(scene==='run'&&G&&!G.paused)update(rdt);
 if(G&&G.boss&&$('bossname').textContent!==ZONES[G.zone].bn)$('bossname').textContent=ZONES[G.zone].bn;
 render();requestAnimationFrame(frame)}
